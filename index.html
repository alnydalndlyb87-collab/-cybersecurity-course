<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأمن السيبراني</title>
<style>
body{background:#020a14;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:sans-serif;color:white}
.cover-box{position:relative;animation:float 3.5s ease-in-out infinite}
.cover-box img{width:92vw;max-width:850px;border-radius:24px;animation:glow 2s infinite alternate;border:3px solid #00d4ff}
@keyframes glow{
0%{box-shadow:0 0 20px #00d4ff,0 0 40px #00d4ff44;filter:brightness(1)}
100%{box-shadow:0 0 50px #00d4ff,0 0 90px #00ff88,0 0 120px #00d4ff66;filter:brightness(1.25)}
}
@keyframes float{
0%,100%{transform:translateY(0) scale(1)}
50%{transform:translateY(-18px) scale(1.02)}
}
h1{color:#00e5ff;text-shadow:0 0 15px #00e5ff,0 0 30px #00e5ff;font-size:32px;margin:25px 0 10px}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.badge{display:inline-block;background:linear-gradient(90deg,#00d4ff,#00ff88);padding:8px 18px;border-radius:30px;color:#000;font-weight:bold;margin-top:15px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="cover-box">
<img src="cover.png" alt="غلاف الامن السيبراني">
</div>
<h1>🛡️ دليل الأمن السيبراني 🛡️</h1>

</body>
</html>
