<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة سيفر</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a141a;color:#fff;font-family:Tahoma;text-align:center;padding:20px}
.box{position:relative;max-width:850px;width:92%;border-radius:25px;overflow:hidden;box-shadow:0 0 40px #00d4ff,0 0 80px #00ff8855;animation:glow 3.5s infinite}
@keyframes glow{0%{box-shadow:0 0 20px #00d4ff,0 0 40px #00ff88}100%{box-shadow:0 0 50px #00d4ff,0 0 90px #00ff88}}
.box img{width:100%;display:block;animation:float 3.5s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.02)}}
h1{color:#5effff;text-shadow:0 0 15px #00d4ff;font-size:32px;margin-top:25px}
p{color:#ccc}
.badge{display:inline-block;background:linear-gradient(90deg,#00d4ff,#00ff88);color:#001a12;padding:12px 28px;border-radius:50px;font-weight:bold;text-decoration:none;box-shadow:0 0 20px #00ff88;margin-top:15px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</head>
<body>
<div class="box">
<img src="cover.png" alt="قواميس قوات حفظ السلام">
</div>
<h1>🛡️ دليل الأمن السيبراني 🛡️</h1>

</body>
</html>
